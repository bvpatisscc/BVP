[project]
name = "model-zoo"
version = "0.1.0"
description = "Structured channel pruning and CSSD quantization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==2.0.2", "omegaconf==2.3.0", "torch==2.11.0"]

[project.scripts]
model-zoo = "model_zoo.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
