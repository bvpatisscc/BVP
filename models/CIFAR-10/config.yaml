name: CIFAR-10
training:
  epochs: 150
  batch_size: 128
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  seed: 42
  batch_norm: true
  augmentation:
    shift: 4
    horizontal_flip: true
data:
  root: ${oc.env:DATA_ROOT,./data}
model:
  input_shape: [4,32,32]
  init_channels: [16,64,72,56,40]
  channels: [8,24,40,40,32]
  strides: [1,1,1,1,1]
  pool_after: [2,3,4,5]
  global_pool: max
  classes: 10
  outputs: 16
pruning:
  recovery:
    epochs: [50,50,50,200]
    learning_rate: 0.05
    weight_decay: 0.0005
    scheduler: cosine
    augmentation:
      shift: 4
      horizontal_flip: true
cssd:
  qat_learning_rate: 0.0001
  calibration_batches: 32
  qat_epochs: 5
  table: ../shared/symmetric_2nzd.json
