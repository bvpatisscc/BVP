name: EuroSAT
training:
  epochs: 150
  batch_size: 128
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  seed: 42
  batch_norm: true
data:
  root: ${oc.env:DATA_ROOT,./data}
model:
  input_shape: [4,64,64]
  init_channels: [16,32,48,48,48,32]
  channels: [8,8,16,16,8,24]
  strides: [1,1,1,1,1,1]
  pool_after: [2,3,4,5,6]
  global_pool: max
  classes: 10
  outputs: 16
pruning:
  recovery:
    epochs: 200
    learning_rate: 0.02
    weight_decay: 0.0005
    scheduler: cosine
    augmentation:
      horizontal_flip: true
      vertical_flip: true
      quarter_turns: true
      brightness: 0.1
cssd:
  equalization_rounds: 6
  qat_optimizer: adam
  qat_learning_rate: 0.0001
  calibration_batches: 32
  qat_epochs: 5
  table: ../shared/symmetric_2nzd.json
